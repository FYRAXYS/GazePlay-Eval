<div class="d-flex justify-content-center p-4">
  <div style="width:100%; max-width:700px">

    <div class="card">
      <div class="card-header">
        <h2 class="card-title text-center">Options </h2>
      </div>
      <div class="card-body">

        <div class="card inner-card mt-3">
          <div class="card-header inner-card-header">Notifications</div>
          <div class="inner-card-body">

            <div class="param-section-title">Affichage des messages</div>
            <div class="param-row">
              <span class="param-label">Durée d'affichage des messages</span>
              <div class="param-control">
                <div class="input-group w-auto">
                  <input type="number"
                         class="form-control"
                         min="0"
                         max="30"
                         step="0.5"
                         [(ngModel)]="options.flashDuration">
                  <span class="input-group-text">secondes</span>
                </div>
              </div>
            </div>

            @if (options.flashDuration === 0) {
              <div class="alert alert-warning py-1 px-3 mb-2" style="font-size: 0.8rem;">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                Une durée de 0 seconde désactive les messages.
              </div>

              <div class="param-row">
                <span class="param-label">Aperçu</span>
                <div class="param-control">
                  <button class="btn btn-secondary btn-sm disabled">
                    Tester
                  </button>
                </div>
              </div>

            } @else {
              <div class="param-row">
                <span class="param-label">Aperçu</span>
                <div class="param-control">
                  <button class="btn btn-secondary btn-sm"
                          (click)="flashService.show('info', 'Ceci est un message de test !', options.flashDuration * 1000)">
                    Tester
                  </button>
                </div>
              </div>
            }



          </div>
        </div>

        <div class="card inner-card mt-3">
          <div class="card-header inner-card-header">Stockage</div>
          <div class="inner-card-body">

            <div class="param-section-title">Stockage des pièces jointes</div>
            <div class="param-row justify-content-center">
              <div class="param-control min-w-0">
                <button class="btn btn-danger btn-sm"
                        (click)="this.emptyDB()">
                  Supprimer tous les fichiers
                </button>
              </div>
            </div>

          </div>
        </div>

      </div>
    </div>

    <div class="d-flex justify-content-between mt-4">
      <button class="btn btn-primary" (click)="goBack()">
        ← Retour
      </button>
      <button class="btn btn-success fw-semibold" (click)="saveDuration()">
        Sauvegarder
      </button>
    </div>

  </div>
</div>
