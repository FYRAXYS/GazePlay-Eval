@if (isOpen) {
  <div class="guide-popup-backdrop" (click)="close()"></div>
}

<aside class="guide-popup-panel" [class.open]="isOpen" [style.width.px]="panelWidth" role="dialog" aria-label="Guide">
  <div class="resize-handle" (mousedown)="startResize($event)"></div>
  <div class="guide-popup-header">
    <h2 class="guide-popup-title">{{ currentGuide.title }}</h2>
    <button
      type="button"
      class="btn-close"
      aria-label="Fermer le guide"
      title="Fermer le guide"
      (click)="close()">
    </button>
  </div>

  <div class="guide-popup-body">
    @if (currentGuideComponent) {
      <ng-container *ngComponentOutlet="currentGuideComponent"></ng-container>
    } @else {
      @if (currentGuide.intro) {
        <p class="guide-content-sub">{{ currentGuide.intro }}</p>
      }

      @for (section of currentGuide.sections; track section.title) {
        <div class="guide-section-card">
          <div class="guide-section-title">{{ section.title }}</div>
          <div class="guide-section-body">{{ section.body }}</div>
        </div>
      } @empty {
        <p class="guide-section-intro text-muted">Contenu du guide à venir.</p>
      }
    }
  </div>
</aside>
